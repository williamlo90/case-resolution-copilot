name: V2 interactive demo

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - frontend/src/**
      - .github/workflows/v2-interactive-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: V2 durable demo integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: demo_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: v2_demo_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U demo_ci -d v2_demo_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://demo_ci:disposable-ci-only@localhost:5432/v2_demo_ci
      SUPPORT_COPILOT_ALLOW_DESTRUCTIVE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - name: Real product commands, tenant isolation, restart recovery and SOP rollback
        run: >-
          uv run --no-env-file pytest -q
          tests/integration/test_v2_interactive_demo.py
          tests/integration/test_resolution_lifecycle.py
          tests/integration/test_sop_revision_lifecycle.py
          --junitxml=../v2-demo-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-demo-integration-${{ github.sha }}
          path: v2-demo-integration.xml
          retention-days: 14
