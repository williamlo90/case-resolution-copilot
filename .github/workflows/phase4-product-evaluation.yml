name: Phase 4 isolated product evaluation

on:
  push:
    branches: [codex/phase4-eval-candidate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-input-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime without oracle labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase4-runtime/backend/scripts
          mkdir -p phase4-runtime/backend/evaluations/case_resolution_v2_phase4/development
          mkdir -p phase4-runtime/backend/evaluations/case_resolution_v2_phase4/holdout
          cp -R backend/app backend/migrations phase4-runtime/backend/
          cp backend/alembic.ini backend/pyproject.toml backend/uv.lock backend/README.md phase4-runtime/backend/
          cp backend/scripts/__init__.py backend/scripts/capture_phase4_run.py phase4-runtime/backend/scripts/
          cp backend/evaluations/case_resolution_v2_phase4/development.manifest.v1.json phase4-runtime/backend/evaluations/case_resolution_v2_phase4/
          cp backend/evaluations/case_resolution_v2_phase4/holdout.manifest.v1.json phase4-runtime/backend/evaluations/case_resolution_v2_phase4/
          cp -R backend/evaluations/case_resolution_v2_phase4/development/inputs phase4-runtime/backend/evaluations/case_resolution_v2_phase4/development/
          cp -R backend/evaluations/case_resolution_v2_phase4/holdout/inputs phase4-runtime/backend/evaluations/case_resolution_v2_phase4/holdout/
          test ! -e phase4-runtime/backend/evaluations/case_resolution_v2_phase4/holdout/labels
          test ! -e phase4-runtime/backend/evaluations/case_resolution_v2_phase4/development/labels
          tar -czf phase4-runtime.tar.gz -C phase4-runtime backend
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-input-only-${{ github.sha }}
          path: phase4-runtime.tar.gz
          retention-days: 30

  capture-development:
    needs: bundle-input-only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: phase4
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: phase4_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U phase4 -d phase4_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPPORT_COPILOT_DATABASE_URL: postgresql+psycopg://phase4:disposable-ci-only@localhost:5432/phase4_dev
      PHASE4_DATABASE_URL: postgresql+psycopg://phase4:disposable-ci-only@localhost:5432/phase4_dev
      PHASE4_ISOLATED_RUN: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase4-input-only-${{ github.sha }}
      - run: tar -xzf phase4-runtime.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Capture exposed development cases
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run alembic upgrade head
          uv run python -m scripts.capture_phase4_run \
            --root evaluations/case_resolution_v2_phase4 \
            --split development --output ../run-development --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-development-observations-${{ github.sha }}
          path: run-development/
          retention-days: 30

  score-development:
    needs: capture-development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase4-development-observations-${{ github.sha }}
          path: run-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Score sealed development observations
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run python -m scripts.score_phase4_run \
            --root evaluations/case_resolution_v2_phase4 \
            --split development --output ../run-development --enforce-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-development-report-${{ github.sha }}
          path: run-development/
          retention-days: 30

  capture-holdout:
    needs: [bundle-input-only, score-development]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: phase4
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: phase4_holdout
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U phase4 -d phase4_holdout"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPPORT_COPILOT_DATABASE_URL: postgresql+psycopg://phase4:disposable-ci-only@localhost:5432/phase4_holdout
      PHASE4_DATABASE_URL: postgresql+psycopg://phase4:disposable-ci-only@localhost:5432/phase4_holdout
      PHASE4_ISOLATED_RUN: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase4-input-only-${{ github.sha }}
      - run: tar -xzf phase4-runtime.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Capture frozen holdout once
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run alembic upgrade head
          uv run python -m scripts.capture_phase4_run \
            --root evaluations/case_resolution_v2_phase4 \
            --split holdout --output ../run-holdout --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-holdout-observations-${{ github.sha }}
          path: run-holdout/
          retention-days: 90

  score-holdout:
    needs: capture-holdout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase4-holdout-observations-${{ github.sha }}
          path: run-holdout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Score sealed holdout
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run python -m scripts.score_phase4_run \
            --root evaluations/case_resolution_v2_phase4 \
            --split holdout --output ../run-holdout --enforce-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-holdout-report-${{ github.sha }}
          path: run-holdout/
          retention-days: 90
