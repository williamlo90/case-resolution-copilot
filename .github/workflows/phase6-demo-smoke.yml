name: Phase 6 isolated demo smoke

on:
  push:
    branches: [codex/phase6-release-candidate]
    paths:
      - ".github/workflows/phase6-demo-smoke.yml"
      - "compose.demo.yaml"
      - "backend/**"
      - "frontend/**"
      - "scripts/demo-compose.ps1"
      - "deploy/demo/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate and build synthetic demo on disposable host
        id: build
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$password"
          printf 'DEMO_POSTGRES_PASSWORD=%s\n' "$password" > "$RUNNER_TEMP/demo.env"
          export COMPOSE_PARALLEL_LIMIT=1
          export DEMO_POSTGRES_PASSWORD="$password"
          export DEMO_IMAGE_TAG="$GITHUB_SHA"

          docker compose -f compose.demo.yaml config --quiet
          docker compose -f compose.demo.yaml build postgres
          docker compose -f compose.demo.yaml build api
          docker compose -f compose.demo.yaml build frontend

      - name: Scan backend demo image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: case-resolution-copilot-demo-api:${{ github.sha }}
          format: json
          output: phase6-api-scan.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Scan frontend demo image for high and critical vulnerabilities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: case-resolution-copilot-demo-frontend:${{ github.sha }}
          format: json
          output: phase6-frontend-scan.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Scan PostgreSQL image for high and critical vulnerabilities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: case-resolution-copilot-demo-postgres:${{ github.sha }}
          format: json
          output: phase6-postgres-scan.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Start, smoke and restart synthetic demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export DEMO_POSTGRES_PASSWORD="$(sed -n 's/^DEMO_POSTGRES_PASSWORD=//p' "$RUNNER_TEMP/demo.env")"
          export DEMO_IMAGE_TAG="$GITHUB_SHA"
          docker compose -f compose.demo.yaml up --detach --wait --wait-timeout 180 --no-build

          curl --fail --silent --show-error http://127.0.0.1:8000/api/health/ready \
            | python -c 'import json,sys; x=json.load(sys.stdin); assert x["status"] == "ready" and x["dependencies"]["database"]["status"] == "healthy"'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/cases
          case_count="$(docker compose -f compose.demo.yaml exec -T postgres \
            psql -U demo -d case_resolution_demo -Atc 'select count(*) from cases')"
          test "$case_count" -gt 0

          docker compose -f compose.demo.yaml restart api
          docker compose -f compose.demo.yaml up --detach --no-deps --wait --wait-timeout 180 --no-build api
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health/ready \
            | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ready"'
          docker compose -f compose.demo.yaml exec -T api .venv/bin/alembic current
          docker compose -f compose.demo.yaml exec -T postgres sh -ec '
            pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /tmp/demo-backup.dump
            createdb -U "$POSTGRES_USER" case_resolution_restore
            pg_restore --exit-on-error -U "$POSTGRES_USER" -d case_resolution_restore /tmp/demo-backup.dump
          '
          restored_count="$(docker compose -f compose.demo.yaml exec -T postgres \
            psql -U demo -d case_resolution_restore -Atc 'select count(*) from cases')"
          test "$case_count" = "$restored_count"
          original_revision="$(docker compose -f compose.demo.yaml exec -T postgres \
            psql -U demo -d case_resolution_demo -Atc 'select version_num from alembic_version')"
          restored_revision="$(docker compose -f compose.demo.yaml exec -T postgres \
            psql -U demo -d case_resolution_restore -Atc 'select version_num from alembic_version')"
          test "$original_revision" = "$restored_revision"
          integrity_sql="SELECT 'organizations',count(*) FROM organizations UNION ALL
            SELECT 'memberships',count(*) FROM memberships UNION ALL
            SELECT 'cases',count(*) FROM cases UNION ALL
            SELECT 'policies',count(*) FROM policies UNION ALL
            SELECT 'policy_versions',count(*) FROM governed_policy_versions UNION ALL
            SELECT 'reviews',count(*) FROM case_reviews UNION ALL
            SELECT 'actions',count(*) FROM case_actions UNION ALL
            SELECT 'attempts',count(*) FROM case_action_attempts UNION ALL
            SELECT 'receipts',count(*) FROM case_action_receipts UNION ALL
            SELECT 'resolution_events',count(*) FROM case_resolution_events UNION ALL
            SELECT 'audit_events',count(*) FROM audit_events UNION ALL
            SELECT 'settings',count(*) FROM organization_settings ORDER BY 1"
          original_counts="$(docker compose -f compose.demo.yaml exec -T postgres \
            psql -U demo -d case_resolution_demo -Atc "$integrity_sql")"
          restored_counts="$(docker compose -f compose.demo.yaml exec -T postgres \
            psql -U demo -d case_resolution_restore -Atc "$integrity_sql")"
          test "$original_counts" = "$restored_counts"
          known_good_image="$(docker image inspect "case-resolution-copilot-demo-api:$GITHUB_SHA" --format '{{.Id}}')"
          printf 'FROM %s\nCMD ["false"]\n' "case-resolution-copilot-demo-api:$GITHUB_SHA" \
            | docker build --tag "case-resolution-copilot-demo-faulted:$GITHUB_SHA" -
          printf 'services:\n  api:\n    image: case-resolution-copilot-demo-faulted:%s\n    restart: "no"\n' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/phase6-fault.yaml"
          docker compose -f compose.demo.yaml -f "$RUNNER_TEMP/phase6-fault.yaml" \
            up --detach --no-deps --no-build --force-recreate api
          faulted_container="$(docker compose -f compose.demo.yaml ps --all --quiet api)"
          fault_exit="$(timeout 30 docker wait "$faulted_container")"
          test "$fault_exit" = 1
          docker compose -f compose.demo.yaml up --detach --no-deps --no-build --force-recreate --wait --wait-timeout 180 api
          restored_image="$(docker inspect "$(docker compose -f compose.demo.yaml ps --quiet api)" --format '{{.Image}}')"
          test "$known_good_image" = "$restored_image"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health/ready \
            | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ready"'
          rollback_revision="$(docker compose -f compose.demo.yaml exec -T postgres \
            psql -U demo -d case_resolution_demo -Atc 'select version_num from alembic_version')"
          test "$original_revision" = "$rollback_revision"
          {
            printf 'commit=%s\nseeded_cases=%s\nrestored_cases=%s\nschema=%s\n' \
              "$GITHUB_SHA" "$case_count" "$restored_count" "$original_revision"
            docker compose -f compose.demo.yaml images
            printf '%s\n' "$restored_counts"
            printf 'faulted_image_exit=%s\nrollback_image=%s\n' "$fault_exit" "$restored_image"
          } > phase6-demo-evidence.txt
          printf 'Synthetic demo and API restart smoke passed for %s\n' "$GITHUB_SHA"

      - name: Capture startup diagnostics on failure
        if: ${{ failure() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          export DEMO_POSTGRES_PASSWORD="$(sed -n 's/^DEMO_POSTGRES_PASSWORD=//p' "$RUNNER_TEMP/demo.env")"
          export DEMO_IMAGE_TAG="$GITHUB_SHA"
          docker compose -f compose.demo.yaml logs --no-color --tail 100 migrate-seed api frontend

      - name: Tear down disposable demo
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/demo.env"; then
            export DEMO_POSTGRES_PASSWORD="$(sed -n 's/^DEMO_POSTGRES_PASSWORD=//p' "$RUNNER_TEMP/demo.env")"
            export DEMO_IMAGE_TAG="$GITHUB_SHA"
            docker compose -f compose.demo.yaml down --volumes --remove-orphans
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-demo-${{ github.sha }}
          path: |
            phase6-*-scan.json
            phase6-demo-evidence.txt
          if-no-files-found: warn
          retention-days: 30

  database-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: phase6
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: phase6_integration
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U phase6 -d phase6_integration"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://phase6:disposable-ci-only@localhost:5432/phase6_integration
      SUPPORT_COPILOT_ALLOW_DESTRUCTIVE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Verify migrations, authority, durable actions and restart recovery
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run pytest -q tests/integration/test_migration.py \
            tests/integration/test_case_action_api.py \
            tests/integration/test_resolution_lifecycle.py \
            --junitxml=../phase6-database-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-database-${{ github.sha }}
          path: phase6-database-tests.xml
          if-no-files-found: warn
          retention-days: 30
