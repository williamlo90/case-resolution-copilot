[project]
name = "case-resolution-copilot-backend"
version = "0.1.0"
description = "Backend for Case Resolution Copilot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    "langgraph>=1.0.10,<2",
    "langgraph-checkpoint>=4.1.1,<5",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "pgvector>=0.4,<1",
    "cryptography>=50,<51",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "PyJWT>=2.13,<3",
    "celery[redis]>=5.5,<6",
]

[dependency-groups]
dev = [
    "httpx2>=2.5,<3",
    "mypy>=1.17,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jwt", "jwt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
