name: case-resolution-copilot-demo

# Synthetic, loopback-only demo on an isolated container host. Never use real credentials/data.
x-database-url: &database-url postgresql+psycopg://${DEMO_POSTGRES_USER:-demo}:${DEMO_POSTGRES_PASSWORD:?Set DEMO_POSTGRES_PASSWORD}@postgres:5432/${DEMO_POSTGRES_DB:-case_resolution_demo}
x-backend-environment: &backend-environment
  SUPPORT_COPILOT_ENVIRONMENT: development
  SUPPORT_COPILOT_AUTH_MODE: deterministic_development
  SUPPORT_COPILOT_MODEL_PROVIDER: deterministic
  SUPPORT_COPILOT_EMBEDDING_PROVIDER: deterministic
  SUPPORT_COPILOT_ACTION_TARGET_PROVIDER: deterministic
  SUPPORT_COPILOT_SOURCE_REVISION: ${DEMO_IMAGE_TAG:-local}
  SUPPORT_COPILOT_DATABASE_URL: *database-url

services:
  postgres:
    image: case-resolution-copilot-demo-postgres:${DEMO_IMAGE_TAG:-local}
    build:
      context: ./deploy/demo
      dockerfile: Containerfile.postgres
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: ${DEMO_POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Set DEMO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DEMO_POSTGRES_DB:-case_resolution_demo}
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate-seed:
    image: case-resolution-copilot-demo-api:${DEMO_IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Containerfile.demo
    environment:
      <<: *backend-environment
      SUPPORT_COPILOT_DEV_MIGRATE: "true"
      SUPPORT_COPILOT_DEV_SEED: "true"
    command: ["true"]
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: case-resolution-copilot-demo-api:${DEMO_IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Containerfile.demo
    environment:
      <<: *backend-environment
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-8000}:8000"
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      migrate-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: case-resolution-copilot-demo-frontend:${DEMO_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Containerfile.demo
      args:
        SOURCE_REVISION: ${DEMO_IMAGE_TAG:-local}
    environment:
      SUPPORT_COPILOT_AUTH_MODE: deterministic_development
      SUPPORT_COPILOT_DATA_MODE: api
      SUPPORT_COPILOT_API_INTERNAL_URL: http://api:8000
      SUPPORT_COPILOT_DEMO_ACTOR_ID: USR-0003
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${DEMO_FRONTEND_PORT:-3000}:3000"
    mem_limit: 1536m
    cpus: 1.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/cases').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

volumes:
  demo-postgres-data:
